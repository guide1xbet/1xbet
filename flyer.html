<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Segoe UI',system-ui,sans-serif;background:#07090f;color:#e8eaf2;min-height:100vh;}
.topbar{background:#0c0f1c;border-bottom:1px solid #1a1f35;padding:0 1.5rem;height:54px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:50;}
.logo{font-size:1.05rem;font-weight:800;color:#fff;letter-spacing:-.01em;}
.logo em{color:#e53935;font-style:normal;}
.badge{background:#e53935;color:#fff;font-size:.56rem;font-weight:800;padding:.12rem .45rem;border-radius:4px;margin-left:.35rem;letter-spacing:.05em;}
.agent-tag{font-size:.72rem;color:#5a6490;background:#12162a;padding:.3rem .85rem;border-radius:20px;border:1px solid #1a1f35;}
.layout{display:grid;grid-template-columns:310px 1fr;height:calc(100vh - 54px);}
.sidebar{background:#0c0f1c;border-right:1px solid #1a1f35;overflow-y:auto;padding:1.1rem;}
.preview-area{background:#05070d;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding:1.5rem;overflow-y:auto;gap:1rem;}
.sec{margin-bottom:1.1rem;}
.sec-title{font-size:.6rem;font-weight:700;color:#3a4265;text-transform:uppercase;letter-spacing:.12em;margin-bottom:.6rem;}

/* TEMPLATES GRID */
.templates-grid{display:grid;grid-template-columns:1fr 1fr;gap:.5rem;}
.tpl-btn{background:#12162a;border:1.5px solid #1a1f35;border-radius:8px;padding:.65rem .4rem;text-align:center;cursor:pointer;transition:all .15s;position:relative;overflow:hidden;}
.tpl-btn:hover{border-color:#e53935;transform:translateY(-1px);}
.tpl-btn.active{border-color:#e53935;background:rgba(229,57,53,.1);}
.tpl-btn .tpl-ico{font-size:1.3rem;display:block;margin-bottom:.25rem;}
.tpl-btn .tpl-name{font-size:.68rem;font-weight:700;color:#8892b0;line-height:1.3;}
.tpl-btn.active .tpl-name{color:#e53935;}
.tpl-hot{position:absolute;top:4px;right:4px;background:#e53935;color:#fff;font-size:.5rem;font-weight:800;padding:.1rem .3rem;border-radius:3px;}

/* FORM */
.fg{margin-bottom:.7rem;}
.fg label{display:block;font-size:.63rem;font-weight:700;color:#3a4265;margin-bottom:.28rem;letter-spacing:.05em;text-transform:uppercase;}
.fg input,.fg textarea,.fg select{width:100%;padding:.48rem .7rem;background:#07090f;border:1px solid #1a1f35;border-radius:6px;font-size:.78rem;color:#e8eaf2;font-family:inherit;transition:border-color .15s;}
.fg input:focus,.fg textarea:focus,.fg select:focus{outline:none;border-color:#e53935;}
.fg input::placeholder,.fg textarea::placeholder{color:#1e2440;}
.fg select option{background:#0c0f1c;}
.fg textarea{resize:vertical;min-height:55px;line-height:1.5;}

/* COLORS */
.color-row{display:flex;gap:.35rem;flex-wrap:wrap;margin-top:.35rem;}
.sw{width:24px;height:24px;border-radius:50%;cursor:pointer;border:2px solid transparent;transition:all .15s;flex-shrink:0;}
.sw.active{border-color:#fff;box-shadow:0 0 0 2px rgba(255,255,255,.2);}

/* BTNS */
.btn-gen{width:100%;background:linear-gradient(135deg,#e53935,#b71c1c);color:#fff;border:none;padding:.68rem;border-radius:8px;font-size:.83rem;font-weight:700;cursor:pointer;margin-top:.2rem;letter-spacing:.02em;transition:opacity .15s;}
.btn-gen:hover{opacity:.88;}
.btn-dl,.btn-wa{width:100%;padding:.58rem;border-radius:8px;font-size:.78rem;font-weight:600;cursor:pointer;margin-top:.4rem;display:none;transition:all .15s;}
.btn-dl{background:#12162a;border:1px solid #1a1f35;color:#e8eaf2;}
.btn-dl:hover{border-color:#e53935;}
.btn-wa{background:rgba(37,211,102,.08);border:1px solid rgba(37,211,102,.25);color:#25d366;}

/* PREVIEW */
.canvas-wrap{border-radius:12px;overflow:hidden;box-shadow:0 25px 80px rgba(0,0,0,.8);position:relative;}
canvas{display:block;max-width:460px;width:100%;height:auto;}
.hint{font-size:.68rem;color:#1e2440;text-align:center;}

/* FORMAT */
.fmt-row{display:flex;gap:.35rem;margin-bottom:.7rem;}
.fmt{flex:1;background:#12162a;border:1px solid #1a1f35;border-radius:6px;padding:.38rem .25rem;text-align:center;cursor:pointer;font-size:.63rem;color:#3a4265;line-height:1.4;transition:all .15s;}
.fmt.active{border-color:#e53935;color:#e53935;background:rgba(229,57,53,.07);}

/* PERSONNALISATION D'ÉCUSSON */
.perso{margin:.35rem 0 .1rem;padding:.5rem;background:#0a0d18;border:1px solid #171c30;border-radius:7px;}
.motifs{display:flex;gap:.3rem;margin-bottom:.45rem;}
.motif{flex:1;height:30px;border-radius:5px;border:2px solid #1a1f35;cursor:pointer;overflow:hidden;position:relative;transition:border-color .15s;}
.motif.active{border-color:#e53935;}
.motif canvas{width:100%;height:100%;display:block;}
.cols{display:flex;gap:.4rem;align-items:center;}
.cols label{font-size:.58rem;color:#3a4265;font-weight:700;text-transform:uppercase;letter-spacing:.04em;}
.cols input[type=color]{width:30px;height:26px;padding:0;border:1px solid #1a1f35;border-radius:5px;background:#07090f;cursor:pointer;}

#blocked{position:fixed;inset:0;background:#07090f;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:.75rem;z-index:999;}
@media(max-width:700px){.layout{grid-template-columns:1fr;height:auto;}.preview-area{padding:1rem;}.canvas-wrap canvas{max-width:100%;}}
</style>
</head>

<script>
// Aucune fiche ni aucune clé dans ce fichier : il est public, et tout ce qui y figure
// est lisible par n'importe quel agent. Le serveur valide la clé et ne renvoie que
// l'agent demandé — un agent ne peut plus ouvrir le générateur d'un autre.
var AG=null,TPL='football',FMT='carre';
var PALETTES={
  red:{bg1:'#0d0002',bg2:'#1a0005',acc:'#e53935',acc2:'#ff8f00',glow:'rgba(229,57,53,0.4)'},
  blue:{bg1:'#000d1a',bg2:'#001529',acc:'#1565c0',acc2:'#ffd700',glow:'rgba(21,101,192,0.4)'},
  green:{bg1:'#001a05',bg2:'#00260a',acc:'#2e7d32',acc2:'#76ff03',glow:'rgba(46,125,50,0.4)'},
  purple:{bg1:'#0d0018',bg2:'#1a0030',acc:'#6a1b9a',acc2:'#ea80fc',glow:'rgba(106,27,154,0.4)'},
  dark:{bg1:'#05050f',bg2:'#0d0d1f',acc:'#e94560',acc2:'#0f3460',glow:'rgba(233,69,96,0.4)'},
  orange:{bg1:'#1a0500',bg2:'#2d0a00',acc:'#e64a19',acc2:'#ffd740',glow:'rgba(230,74,25,0.4)'}
};
var PAL=PALETTES.red;

function bloquer(){ document.getElementById('blocked').style.display='flex'; }

var MOTIF_PERSO={1:'solid',2:'stripes'};
var MOTIFS_DISPO=[
  {t:'solid',   nom:'Uni'},
  {t:'stripes', nom:'Rayures'},
  {t:'hoops',   nom:'Cerclé'},
  {t:'halves',  nom:'Deux moitiés'},
  {t:'vband',   nom:'Bande centrale'},
  {t:'diag',    nom:'Diagonale'},
  {t:'mono',    nom:'Initiales'}
];

/* Vignettes de motif : chacune est un mini-canvas peint par le meme moteur que
   l'ecusson final, donc ce que l'agent voit est exactement ce qu'il obtient. */
function remplirMotifs(n){
  var hote=document.getElementById('motifs'+n);
  if(!hote) return;
  hote.innerHTML='';
  MOTIFS_DISPO.forEach(function(m){
    var d=document.createElement('div');
    d.className='motif'+(MOTIF_PERSO[n]===m.t?' active':'');
    d.title=m.nom;
    d.setAttribute('data-t',m.t);
    var cv=document.createElement('canvas');
    cv.width=60; cv.height=34;
    d.appendChild(cv);
    d.onclick=function(){ MOTIF_PERSO[n]=m.t; remplirMotifs(n); draw(); };
    hote.appendChild(d);
  });
  peindreVignettes(n);
}

function peindreVignettes(n){
  var hote=document.getElementById('motifs'+n);
  if(!hote) return;
  var ca=v('c'+n+'a')||'#1565c0', cb=v('c'+n+'b')||'#ffffff';
  Array.prototype.forEach.call(hote.children,function(d){
    var cv=d.querySelector('canvas'); if(!cv) return;
    var c2=cv.getContext('2d');
    c2.clearRect(0,0,cv.width,cv.height);
    peindreMotif(c2,{t:d.getAttribute('data-t'),c:[ca,cb],
      ini:initiales(v('f-eq'+n))},0,0,cv.width,cv.height);
  });
}

/* Remplit les deux listes d'equipes. Deux groupes separes : un agent cherche
   soit une selection nationale, soit un club, jamais les deux melanges. */
function remplirEquipes(){
  ['f-sel1','f-sel2'].forEach(function(id,idx){
    var sel=document.getElementById(id);
    if(!sel) return;
    var grp={nation:'Sélections nationales', club:'Clubs'};
    ['nation','club'].forEach(function(g){
      var og=document.createElement('optgroup');
      og.label=grp[g];
      Object.keys(EQUIPES).forEach(function(cle){
        if(EQUIPES[cle].grp!==g) return;
        var o=document.createElement('option');
        o.value=cle; o.textContent=EQUIPES[cle].nom;
        og.appendChild(o);
      });
      sel.appendChild(og);
    });
    // Toujours en tete : c'est le choix qui rend le generateur utilisable pour
    // un club absent de la table, donc il ne doit pas se chercher.
    var perso=document.createElement('option');
    perso.value='perso'; perso.textContent='✎ Personnalisé (tout autre club)';
    sel.insertBefore(perso, sel.firstChild);
    sel.value=idx===0?'gn':'sn';
  });
}

/* Le panneau motif+couleurs ne s'affiche que pour « Personnalisé » : le laisser
   visible en permanence laisserait croire qu'il agit sur un ecusson connu. */
function majPanneaux(){
  [1,2].forEach(function(n){
    var sel=document.getElementById('f-sel'+n), pan=document.getElementById('perso'+n);
    if(sel&&pan) pan.style.display=(sel.value==='perso')?'block':'none';
  });
}

/* Choisir un ecusson reecrit le nom affiche — sauf si l'agent l'a personnalise :
   ecraser « Les Elephants » par « Cote d'Ivoire » a chaque clic serait penible. */
function majEquipe(n){
  var sel=document.getElementById('f-sel'+n), champ=document.getElementById('f-eq'+n);
  majPanneaux();
  if(sel&&champ&&sel.value!=='perso'){
    var connu=Object.keys(EQUIPES).some(function(c){ return EQUIPES[c].nom===champ.value; });
    if(connu||!champ.value) champ.value=EQUIPES[sel.value].nom;
  }
  draw();
}

function init(){
  remplirEquipes();
  remplirMotifs(1); remplirMotifs(2);
  majPanneaux();
  var p=new URLSearchParams(location.search);
  var ref=(p.get('ref')||'').toLowerCase(), key=p.get('key')||'';
  if(!ref||!key){ bloquer(); return; }
  fetch(SERVEUR_QR+'/flyer-auth',{
    method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({ ref:ref, key:key })
  })
  .then(function(r){ return r.ok ? r.json() : null; })
  .then(function(d){
    if(!d||!d.success||!d.agent){ bloquer(); return; }
    // Le serveur renvoie la ref : le QR en a besoin pour construire le lien de l'agent.
    AG=d.agent;
    document.getElementById('agent-tag').textContent=AG.flag+' '+AG.nom;
    draw();
  })
  .catch(function(){ bloquer(); });
}

function setTpl(t,el){
  TPL=t;
  document.querySelectorAll('.tpl-btn').forEach(b=>b.classList.remove('active'));
  el.classList.add('active');
  ['football','bonus','can','temoignage','promo','retrait'].forEach(f=>{
    document.getElementById('form-'+f).style.display=f===t?'block':'none';
  });
  draw();
}

function setFmt(f,el){
  FMT=f;
  document.querySelectorAll('.fmt').forEach(b=>b.classList.remove('active'));
  el.classList.add('active');
  draw();
}

function setPalette(name,el){
  PAL=PALETTES[name];
  document.querySelectorAll('.sw').forEach(s=>s.classList.remove('active'));
  el.classList.add('active');
  draw();
}

function getSz(){
  if(FMT==='story')return{w:1080,h:1920};
  if(FMT==='paysage')return{w:1200,h:630};
  return{w:1080,h:1080};
}

var SERVEUR_QR = 'https://mobcash-server.onrender.com';
var qrCache = {};
// crossOrigin est indispensable : sans lui, dessiner l'image teinte le canvas et
// toDataURL() lève une erreur au moment du téléchargement.
function chargeQR(ref){
  if(qrCache[ref]) return Promise.resolve(qrCache[ref]);
  return new Promise(function(res, rej){
    var img = new Image();
    img.crossOrigin = 'anonymous';
    img.onload = function(){ qrCache[ref] = img; res(img); };
    img.onerror = function(){ rej(new Error('QR indisponible')); };
    img.src = SERVEUR_QR + '/qr/' + ref + '?size=512';
  });
}

function dessineQR(ctx, img, W, H, s){
  // Coin superieur droit : le bas du visuel porte deja le nom de l'agent, son
  // telephone et le bandeau de confiance. Un QR pose la l'ecrasait.
  var taille = Math.round(165 * s);
  var marge = Math.round(40 * s);
  var x = W - taille - marge;
  var y = marge + Math.round((H > W ? 150 : 118) * s);
  ctx.save();
  ctx.fillStyle = '#fff';
  ctx.fillRect(x - 8 * s, y - 8 * s, taille + 16 * s, taille + 16 * s + 26 * s);
  ctx.drawImage(img, x, y, taille, taille);
  ctx.fillStyle = '#111';
  ctx.font = '700 ' + Math.round(15 * s) + 'px system-ui, sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText('Scannez pour jouer', x + taille / 2, y + taille + 19 * s);
  ctx.restore();
}

function draw(){
  // L'interface repond avant la validation de la cle : sans agent, il n'y a rien a
  // dessiner et lire AG.nom leverait une exception a chaque clic.
  if(!AG) return;
  if(!AG)return;
  var sz=getSz(),W=sz.w,H=sz.h,s=W/1080;
  var cv=document.getElementById('c');
  cv.width=W;cv.height=H;

  if(TPL==='football'){ peindreVignettes(1); peindreVignettes(2); }

  drawBG(ctx,W,H,s);
  drawHeader(ctx,W,H,s);

  if(TPL==='football')tplFootball(ctx,W,H,s);
  else if(TPL==='bonus')tplBonus(ctx,W,H,s);
  else if(TPL==='can')tplCAN(ctx,W,H,s);
  else if(TPL==='temoignage')tplTemoignage(ctx,W,H,s);

      .catch(function(){ /* serveur endormi : le flyer reste utilisable sans QR */ });
  }
}

function drawBG(ctx,W,H,s){
  // Fond principal
  var bg=ctx.createLinearGradient(0,0,W,H);
  bg.addColorStop(0,PAL.bg1);
  bg.addColorStop(0.5,PAL.bg2);
  bg.addColorStop(1,PAL.bg1);
  ctx.fillStyle=bg;
  ctx.fillRect(0,0,W,H);

  // Effet lumière gauche (bleu)
  var gl=ctx.createRadialGradient(0,H*0.4,0,0,H*0.4,W*0.7);
  gl.addColorStop(0,'rgba(30,60,180,0.25)');
  gl.addColorStop(1,'transparent');
  ctx.fillStyle=gl;
  ctx.fillRect(0,0,W,H);

  // Effet lumière droite (couleur accent)
  var gr=ctx.createRadialGradient(W,H*0.4,0,W,H*0.4,W*0.7);
  gr.addColorStop(0,PAL.glow);
  gr.addColorStop(1,'transparent');
  ctx.fillStyle=gr;
  ctx.fillRect(0,0,W,H);

  // Lignes diagonales subtiles
  ctx.save();
  ctx.globalAlpha=0.025;
  for(var i=0;i<12;i++){
    ctx.beginPath();
    ctx.moveTo(-200*s+i*200*s,0);
    ctx.lineTo(W-200*s+i*200*s,H);
    ctx.strokeStyle='#fff';
    ctx.lineWidth=80*s;
    ctx.stroke();
  }
  ctx.restore();

  // Cercles décoratifs
  ctx.save();
  ctx.globalAlpha=0.06;
  for(var j=0;j<5;j++){
    ctx.beginPath();
    ctx.arc(W*0.85,H*0.2,(j+1)*120*s,0,Math.PI*2);
    ctx.strokeStyle=PAL.acc;
    ctx.lineWidth=2*s;
    ctx.stroke();
  }
  for(var k=0;k<4;k++){
    ctx.beginPath();
    ctx.arc(W*0.15,H*0.8,(k+1)*100*s,0,Math.PI*2);
    ctx.strokeStyle='#3060cc';
    ctx.lineWidth=2*s;
    ctx.stroke();
  }
  ctx.restore();

  // Bande top
  var topG=ctx.createLinearGradient(0,0,W,0);
  topG.addColorStop(0,'rgba(30,60,180,0.8)');
  topG.addColorStop(0.5,PAL.acc);
  topG.addColorStop(1,'rgba(30,60,180,0.8)');
  ctx.fillStyle=topG;
  ctx.fillRect(0,0,W,5*s);
}

function drawHeader(ctx,W,H,s){
  ctx.save();
  ctx.textAlign='center';

  // Logo 1XBET avec style premium
  var logoY=80*s;
  ctx.font='900 '+(72*s)+'px "Segoe UI",Arial Black';
  ctx.fillStyle='rgba(255,255,255,0.95)';
  ctx.shadowColor=PAL.acc;
  ctx.shadowBlur=0;
  // Dessiner "1" "X" "BET" séparément
  var metrics1=ctx.measureText('1');
  var metricsX=ctx.measureText('X');
  var metricsB=ctx.measureText('BET');
  var totalW=metrics1.width+metricsX.width+metricsB.width;
  var startX=W/2-totalW/2;
  ctx.textAlign='left';
  ctx.fillStyle='#fff';
  ctx.fillText('1',startX,logoY);
  ctx.fillStyle=PAL.acc2;
  ctx.shadowColor=PAL.acc2;
  ctx.shadowBlur=15*s;
  ctx.fillText('X',startX+metrics1.width,logoY);
  ctx.shadowBlur=0;
  ctx.fillStyle='#fff';
  ctx.fillText('BET',startX+metrics1.width+metricsX.width,logoY);
  ctx.restore();

  // Ligne séparatrice header
  var lg=ctx.createLinearGradient(0,0,W,0);
  lg.addColorStop(0,'transparent');
  lg.addColorStop(0.3,PAL.acc2);
  lg.addColorStop(0.7,PAL.acc2);
  lg.addColorStop(1,'transparent');
  ctx.fillStyle=lg;
  ctx.fillRect(W/2-280*s,92*s,560*s,2*s);
}

/* Drapeau rectangulaire, pour le pied de page et partout ou l'ecusson
   serait trop lourd. */
function drapeauPetit(ctx,code,x,y,w,h,s){
  var e=EQUIPES[code];
  if(!e) return 0;
  ctx.save();
  roundRect(ctx,x,y,w,h,3*s); ctx.clip();
  peindreMotif(ctx,e.d,x,y,w,h);
  ctx.restore();
  roundRect(ctx,x,y,w,h,3*s);
  ctx.strokeStyle='rgba(255,255,255,0.5)'; ctx.lineWidth=1.2*s; ctx.stroke();
  return w;
}

/* Forme d'ecusson de football : epaules droites, flancs qui se resserrent,
   pointe basse. Tout le motif est clippe dedans, donc un seul chemin sert
   a la fois de masque, de bordure et d'ombre portee. */
function cheminEcusson(ctx,x,y,w,h){
  var r=w*0.13;
  ctx.beginPath();
  ctx.moveTo(x+r,y);
  ctx.lineTo(x+w-r,y);
  ctx.quadraticCurveTo(x+w,y,x+w,y+r);
  ctx.lineTo(x+w,y+h*0.50);
  ctx.quadraticCurveTo(x+w,y+h*0.82,x+w/2,y+h);
  ctx.quadraticCurveTo(x,y+h*0.82,x,y+h*0.50);
  ctx.lineTo(x,y+r);
  ctx.quadraticCurveTo(x,y,x+r,y);
  ctx.closePath();
}

function etoile(ctx,cx,cy,rExt,rInt,branches,rot){
  ctx.beginPath();
  var pas=Math.PI/branches, a=(rot||-Math.PI/2);
  for(var i=0;i<branches*2;i++){
    var r=(i%2===0)?rExt:rInt;
    ctx[i===0?'moveTo':'lineTo'](cx+Math.cos(a)*r, cy+Math.sin(a)*r);
    a+=pas;
  }
  ctx.closePath();
}

/* Peint le motif d'une equipe dans le rectangle (x,y,w,h), deja clippe par
   l'appelant a la forme de l'ecusson. */
function peindreMotif(ctx,d,x,y,w,h){
  var c=d.c||['#888888'], t=d.t||'solid', i;

  if(t==='solid'){
    ctx.fillStyle=c[0]; ctx.fillRect(x,y,w,h);

  } else if(t==='vbands'){
    // La bande centrale peut etre double (Espagne) : mid porte son poids.
    var poids=[], tot=0;
    for(i=0;i<c.length;i++){ var p=(d.mid&&i===1)?d.mid:1; poids.push(p); tot+=p; }
    var cx=x;
    for(i=0;i<c.length;i++){
      var lw=w*poids[i]/tot;
      ctx.fillStyle=c[i]; ctx.fillRect(cx,y,lw+0.5,h); cx+=lw;
    }

  } else if(t==='hbands'){
    var poidsH=[], totH=0;
    for(i=0;i<c.length;i++){ var ph=(d.mid&&i===1)?d.mid:1; poidsH.push(ph); totH+=ph; }
    var cy=y;
    for(i=0;i<c.length;i++){
      var lh=h*poidsH[i]/totH;
      ctx.fillStyle=c[i]; ctx.fillRect(x,cy,w,lh+0.5); cy+=lh;
    }

  } else if(t==='halves'){
    ctx.fillStyle=c[0]; ctx.fillRect(x,y,w*0.4,h);
    ctx.fillStyle=c[1]; ctx.fillRect(x+w*0.4,y,w*0.6,h);

  } else if(t==='stripes'){
    // Rayures verticales facon maillot : nombre impair pour que le centre
    // tombe sur une rayure, sinon l'ecusson parait coupe en deux.
    var n=7, lwS=w/n;
    for(i=0;i<n;i++){ ctx.fillStyle=c[i%2]; ctx.fillRect(x+i*lwS,y,lwS+0.5,h); }

  } else if(t==='hoops'){
    var nh=7, lhH=h/nh;
    for(i=0;i<nh;i++){ ctx.fillStyle=c[i%2]; ctx.fillRect(x,y+i*lhH,w,lhH+0.5); }

  } else if(t==='vband'){
    ctx.fillStyle=c[0]; ctx.fillRect(x,y,w,h);
    ctx.fillStyle=c[1]; ctx.fillRect(x+w*0.36,y,w*0.28,h);

  } else if(t==='diag'){
    ctx.fillStyle=c[0]; ctx.fillRect(x,y,w,h);
    ctx.save();
    ctx.strokeStyle=c[1]; ctx.lineWidth=h*0.30;
    ctx.beginPath(); ctx.moveTo(x-w*0.2,y+h*0.95); ctx.lineTo(x+w*1.2,y-h*0.05); ctx.stroke();
    ctx.restore();

  } else if(t==='mono'){
    // Repli quand l'agent n'a rien choisi : plutot que rien, les initiales du
    // nom saisi. Un ecusson vide se remarque bien plus qu'un monogramme.
    ctx.fillStyle=c[0]; ctx.fillRect(x,y,w,h);
    var ini=d.ini||'?';
    var tm=w*(ini.length>1?0.40:0.55);
    ctx.save();
    ctx.textAlign='center';
    ctx.fillStyle=c[1]||'#ffffff';
    ctx.font='900 '+tm+'px "Segoe UI",Arial Black,Arial';
    ctx.fillText(ini,x+w/2,y+h*0.58);
    ctx.restore();
  }

  // --- Surcharges ---
  var cxm=x+w/2, cym=y+h*0.46, ref=Math.min(w,h);

  if(d.ov==='lband'){ ctx.fillStyle=d.ovc; ctx.fillRect(x,y,w*0.30,h); }

  if(d.ov==='sash'||d.ov2==='sash'){
    ctx.save();
    ctx.strokeStyle=(d.ov==='sash')?d.ovc:d.ov2c;
    ctx.lineWidth=h*0.13;
    ctx.beginPath(); ctx.moveTo(x-w*0.1,y+h*0.85); ctx.lineTo(x+w*1.1,y-h*0.05); ctx.stroke();
    ctx.restore();
  }

  if(d.ov==='cross'){
    ctx.fillStyle=d.ovc;
    ctx.fillRect(cxm-w*0.09,y,w*0.18,h);
    ctx.fillRect(x,cym-h*0.09,w,h*0.18);
  }

  if(d.ov==='diamond'){
    ctx.save();
    ctx.fillStyle=d.ovc;
    ctx.beginPath();
    ctx.moveTo(cxm,y+h*0.10); ctx.lineTo(x+w*0.90,cym);
    ctx.lineTo(cxm,y+h*0.82); ctx.lineTo(x+w*0.10,cym);
    ctx.closePath(); ctx.fill();
    if(d.disc){ ctx.fillStyle=d.disc; ctx.beginPath(); ctx.arc(cxm,cym,ref*0.20,0,Math.PI*2); ctx.fill(); }
    ctx.restore();
  }

  if(d.ov==='disc'){ ctx.fillStyle=d.ovc; ctx.beginPath(); ctx.arc(cxm,cym,ref*0.17,0,Math.PI*2); ctx.fill(); }

  if(d.ov==='sun'){
    ctx.save(); ctx.fillStyle=d.ovc;
    for(i=0;i<16;i++){
      ctx.save(); ctx.translate(cxm,cym); ctx.rotate(i*Math.PI/8);
      ctx.fillRect(-ref*0.016,-ref*0.26,ref*0.032,ref*0.11); ctx.restore();
    }
    ctx.beginPath(); ctx.arc(cxm,cym,ref*0.13,0,Math.PI*2); ctx.fill(); ctx.restore();
  }

  if(d.ov==='crescent'){
    // Croissant en soustrayant un disque decale : deux arcs suffisent et le
    // rendu reste net a n'importe quelle taille.
    if(d.disc){ ctx.fillStyle=d.disc; ctx.beginPath(); ctx.arc(cxm,cym,ref*0.26,0,Math.PI*2); ctx.fill(); }
    ctx.save();
    ctx.fillStyle=d.ovc;
    ctx.beginPath(); ctx.arc(cxm-ref*0.02,cym,ref*0.19,0,Math.PI*2); ctx.fill();
    ctx.globalCompositeOperation='destination-out';
    ctx.beginPath(); ctx.arc(cxm+ref*0.06,cym,ref*0.155,0,Math.PI*2); ctx.fill();
    ctx.restore();
    ctx.fillStyle=d.ovc;
    etoile(ctx,cxm+ref*0.10,cym,ref*0.085,ref*0.036,5); ctx.fill();
  }

  if(d.ov==='star'||d.ov2==='star'){
    ctx.fillStyle=(d.ov==='star')?d.ovc:d.ov2c;
    etoile(ctx,cxm,cym,ref*0.20,ref*0.085,5); ctx.fill();
  }
}

/* Ecusson complet : ombre portee, motif, reflet, liseré metallique. */
function dessineEcusson(ctx,eq,x,y,w,h,s){
  var d=eq.d;
  ctx.save();

  // Ombre portee — decolle l'ecusson du fond
  ctx.save();
  ctx.shadowColor='rgba(0,0,0,0.65)';
  ctx.shadowBlur=26*s; ctx.shadowOffsetY=10*s;
  cheminEcusson(ctx,x,y,w,h);
  ctx.fillStyle='#000'; ctx.fill();
  ctx.restore();

  // Motif, clippe a la forme
  ctx.save();
  cheminEcusson(ctx,x,y,w,h); ctx.clip();
  peindreMotif(ctx,d,x,y,w,h);

  // Reflet haut : donne le volume, sans quoi l'ecusson reste un aplat
  var refl=ctx.createLinearGradient(0,y,0,y+h*0.55);
  refl.addColorStop(0,'rgba(255,255,255,0.26)');
  refl.addColorStop(1,'rgba(255,255,255,0)');
  ctx.fillStyle=refl; ctx.fillRect(x,y,w,h*0.55);

  // Ombre interne basse
  var omb=ctx.createLinearGradient(0,y+h*0.55,0,y+h);
  omb.addColorStop(0,'rgba(0,0,0,0)');
  omb.addColorStop(1,'rgba(0,0,0,0.35)');
  ctx.fillStyle=omb; ctx.fillRect(x,y+h*0.55,w,h*0.45);
  ctx.restore();

  // Lisere metallique
  var accent=d.acc||'#d9c187';
  var bord=ctx.createLinearGradient(x,y,x+w,y+h);
  bord.addColorStop(0,'#ffffff');
  bord.addColorStop(0.35,accent);
  bord.addColorStop(0.7,'rgba(255,255,255,0.85)');
  bord.addColorStop(1,accent);
  cheminEcusson(ctx,x,y,w,h);
  ctx.strokeStyle=bord; ctx.lineWidth=5*s; ctx.stroke();

  ctx.restore();
}

/* Texte a chasse elargie : ctx.letterSpacing n'existe pas partout, on place
   donc les lettres une a une. */
function texteEspace(ctx,txt,cx,y,esp){
  var i, larg=0, ch=[];
  for(i=0;i<txt.length;i++){ ch.push(txt[i]); larg+=ctx.measureText(txt[i]).width+esp; }
  larg-=esp;
  var x=cx-larg/2, ali=ctx.textAlign;
  ctx.textAlign='left';
  for(i=0;i<ch.length;i++){ ctx.fillText(ch[i],x,y); x+=ctx.measureText(ch[i]).width+esp; }
  ctx.textAlign=ali;
  return larg;
}

/* Ajuste la police pour qu'un nom d'equipe tienne dans la largeur donnee :
   « Manchester United » debordait sur l'ecusson voisin. */
function policeAjustee(ctx,txt,taille,maxW,s){
  var t=taille;
  while(t>15){
    ctx.font='900 '+(t*s)+'px "Segoe UI",Arial Black,Arial';
    if(ctx.measureText(txt).width<=maxW) break;
    t-=2;
  }
  return t;
}

/* Initiales d'un nom d'equipe : « ASEC Abidjan » -> « AA », « Barcelone » -> « B ».
   Les mots de liaison ne comptent pas, sinon « Union de Douala » donnerait « UDD ». */
function initiales(nom){
  var vides={de:1,du:1,des:1,la:1,le:1,les:1,d:1,el:1,al:1,fc:0,ac:0,as:0};
  var mots=String(nom||'').split(/[\s'’-]+/).filter(function(m){
    return m && vides[m.toLowerCase()]!==1;
  });
  if(!mots.length) return '?';
  if(mots.length===1) return mots[0].charAt(0).toUpperCase();
  return (mots[0].charAt(0)+mots[1].charAt(0)).toUpperCase();
}

/* Une equipe se resout dans cet ordre : personnalisee (motif + couleurs
   choisis par l'agent), connue (table EQUIPES), sinon monogramme construit
   depuis le nom saisi. Aucun club ne peut donc rester sans ecusson. */
function equipeDe(id,nomLibre,n){
  if(id==='perso' && n){
    return {nom:nomLibre||'Équipe', d:{
      t: MOTIF_PERSO[n]||'solid',
      c: [v('c'+n+'a')||'#1565c0', v('c'+n+'b')||'#ffffff'],
      acc: v('c'+n+'c')||'#ffd700',
      ini: initiales(nomLibre)
    }};
  }
  var e=EQUIPES[id];
  if(e) return e;
  var nom=nomLibre||'Équipe';
  return {nom:nom, d:{t:'mono', c:['#232a42','#e8eaf2'], acc:'#8b9bbd', ini:initiales(nom)}};
}

function tplFootball(ctx,W,H,s){
  var id1=v('f-sel1')||'gn', id2=v('f-sel2')||'sn';
  var eq1=equipeDe(id1,v('f-eq1'),1), eq2=equipeDe(id2,v('f-eq2'),2);
  var nom1=(v('f-eq1')||eq1.nom).toUpperCase();
  var nom2=(v('f-eq2')||eq2.nom).toUpperCase();
  var comp=v('f-comp')||'Champions League', date=v('f-date')||'Ce soir à 21:00';
  var isStory=FMT==='story', isPay=FMT==='paysage';
  var k=1;
  // 1200x630 : une fois le bandeau haut et le pied de page poses, il ne reste
  // que 350 px de hauteur utile. Empiler badge, ecussons, date, accroche et
  // code promo dedans les ecrasait tous. Le paysage a donc sa propre mise en
  // page, en deux colonnes, qui se sert de la largeur au lieu de la subir.
  if(isPay){ tplFootballPaysage(ctx,W,H,s); return; }

  /* ---------------------------------------------------------------
     Geometrie ancree, pas en cascade. Le bloc promo se posait
     auparavant a une distance fixe du dernier element : sur un format
     plus court il finissait sous le pied de page, code promo illisible.
     On reserve donc sa place d'abord, puis on repartit ce qui reste.
     --------------------------------------------------------------- */
  var hPromo=130*s, hFooter=170*s;
  var yPromo=H-hFooter-hPromo-(isPay?14:30)*s;
  var yHaut=(isStory?170:isPay?104:126)*s;
  var dispo=yPromo-yHaut;

  var hBadge=46*s*k, hNom=(isPay?30:46)*s, hDate=(isPay?46:58)*s, hAcc=(isPay?30:42)*s;
  var fixe=hBadge+hNom+hDate+hAcc;

  // L'ecusson absorbe le surplus ou la penurie de hauteur : on part de la
  // taille souhaitee et on la rabote tant que les respirations sont trop
  // maigres, plutot que de laisser deux blocs se chevaucher.
  var ecW=(isStory?332:265)*s, ecH, gap;
  for(var essai=0; essai<40; essai++){
    ecH=ecW*1.12;
    gap=(dispo-fixe-ecH)/5;
    // Sous ce plancher l'ecusson n'est plus lisible ; et une largeur negative
    // faisait lever createRadialGradient (« r1 is less than 0 »), donc plus
    // aucun apercu ni telechargement.
    if(gap>=10*s || ecW<=90*s) break;
    ecW-=6*s;
  }
  if(gap<0) gap=0;

  // Un format tres haut (story) laissait cinq respirations enormes : les blocs
  // se retrouvaient eparpilles sur toute l'affiche, sans rien pour tenir le
  // regard. On plafonne l'ecart et on centre le bloc dans la place restante.
  gap=Math.min(gap,(isStory?58:isPay?13:34)*s);
  var yBloc=yHaut+Math.max(0,(dispo-(fixe+ecH+5*gap))/2);

  /* ---- Badge competition ---- */
  var yBadge=yBloc+gap;
  ctx.save();
  ctx.textAlign='center';
  var compTxt=comp.toUpperCase();
  ctx.font='700 '+(26*s*k)+'px "Segoe UI",Arial';
  var espComp=2.5*s*k;
  var compW=ctx.measureText(compTxt).width+compTxt.length*espComp+86*s*k;
  var compX=W/2-compW/2;
  roundRect(ctx,compX,yBadge,compW,hBadge,hBadge/2);
  var gComp=ctx.createLinearGradient(compX,0,compX+compW,0);
  gComp.addColorStop(0,'rgba(255,255,255,0.03)');
  gComp.addColorStop(0.5,'rgba(255,255,255,0.10)');
  gComp.addColorStop(1,'rgba(255,255,255,0.03)');
  ctx.fillStyle=gComp; ctx.fill();
  ctx.strokeStyle=PAL.acc2; ctx.lineWidth=1.5*s; ctx.globalAlpha=0.55; ctx.stroke(); ctx.globalAlpha=1;
  // Ballon trace, pas l'emoji ⚽ : celui-ci a un dessin different sur chaque OS.
  var bx=compX+30*s*k, by=yBadge+hBadge/2, br=9*s*k;
  ctx.beginPath(); ctx.arc(bx,by,br,0,Math.PI*2);
  ctx.fillStyle='#fff'; ctx.fill();
  ctx.fillStyle='#111';
  etoile(ctx,bx,by,br*0.52,br*0.24,5); ctx.fill();
  ctx.fillStyle='rgba(255,255,255,0.92)';
  ctx.font='700 '+(26*s*k)+'px "Segoe UI",Arial';
  texteEspace(ctx,compTxt,W/2+14*s*k,yBadge+hBadge*0.66,espComp);
  ctx.restore();

  /* ---- Écussons ---- */
  var ecY=yBadge+hBadge+gap;
  var ecart=Math.min((isStory?330:isPay?205:305)*s, W/2-ecW/2-26*s);
  var x1=W/2-ecart-ecW/2, x2=W/2+ecart-ecW/2;

  // Halo teinte de la couleur dominante : l'ecusson se detache du fond
  // sombre sans qu'on ait a poser un cadre autour.
  [[x1,eq1],[x2,eq2]].forEach(function(p){
    var cxh=p[0]+ecW/2, cyh=ecY+ecH*0.45;
    var g=ctx.createRadialGradient(cxh,cyh,0,cxh,cyh,ecW*0.95);
    g.addColorStop(0,'rgba(255,255,255,0.16)');
    g.addColorStop(0.45,(p[1].d.c&&p[1].d.c[0]||'#ffffff')+'22');
    g.addColorStop(1,'rgba(0,0,0,0)');
    ctx.fillStyle=g;
    ctx.fillRect(cxh-ecW,cyh-ecW,ecW*2,ecW*2);
  });

  dessineEcusson(ctx,eq1,x1,ecY,ecW,ecH,s);
  dessineEcusson(ctx,eq2,x2,ecY,ecW,ecH,s);

  /* ---- Noms d'équipes ---- */
  var nomY=ecY+ecH+gap+hNom*0.72;
  ctx.save();
  ctx.textAlign='center';
  ctx.fillStyle='#fff';
  ctx.shadowColor='rgba(0,0,0,0.85)'; ctx.shadowBlur=12*s;
  // Le texte est centre sous son ecusson : la place reelle est deux fois la
  // marge qui reste jusqu'au bord, pas la distance entre les deux ecussons.
  var maxNom=Math.min(ecart*1.8,(W/2-ecart-22*s)*2);
  [[W/2-ecart,nom1],[W/2+ecart,nom2]].forEach(function(p){
    var t=policeAjustee(ctx,p[1],38,maxNom,s);
    ctx.font='900 '+(t*s)+'px "Segoe UI",Arial Black,Arial';
    ctx.fillText(p[1],p[0],nomY);
  });
  ctx.restore();

  /* ---- VS central ---- */
  var vsY=ecY+ecH*0.46, vsR=Math.min(ecW*0.26,(isStory?76:66)*s);
  ctx.save();
  // Trait de tension entre les deux ecussons : conduit le regard de l'un a l'autre
  var lg=ctx.createLinearGradient(W/2-ecart,vsY,W/2+ecart,vsY);
  lg.addColorStop(0,'rgba(255,255,255,0)');
  lg.addColorStop(0.5,'rgba(255,255,255,0.30)');
  lg.addColorStop(1,'rgba(255,255,255,0)');
  ctx.strokeStyle=lg; ctx.lineWidth=1.5*s;
  ctx.beginPath(); ctx.moveTo(W/2-ecart*0.8,vsY); ctx.lineTo(W/2+ecart*0.8,vsY); ctx.stroke();

  // Losange sur pointe : plus incisif qu'un cercle, et fait echo a l'ecusson
  ctx.translate(W/2,vsY); ctx.rotate(Math.PI/4);
  ctx.shadowColor='rgba(0,0,0,0.7)'; ctx.shadowBlur=22*s; ctx.shadowOffsetY=6*s;
  roundRect(ctx,-vsR*0.72,-vsR*0.72,vsR*1.44,vsR*1.44,vsR*0.22);
  var gVs=ctx.createLinearGradient(-vsR,-vsR,vsR,vsR);
  gVs.addColorStop(0,lerpHex(PAL.acc,'#ffffff',0.25));
  gVs.addColorStop(1,lerpHex(PAL.acc,'#000000',0.45));
  ctx.fillStyle=gVs; ctx.fill();
  ctx.shadowBlur=0; ctx.shadowOffsetY=0;
  ctx.strokeStyle=PAL.acc2; ctx.lineWidth=2.5*s; ctx.stroke();
  ctx.rotate(-Math.PI/4);
  ctx.font='900 '+(vsR*0.72)+'px "Segoe UI",Arial Black,Arial';
  ctx.fillStyle='#fff'; ctx.textAlign='center';
  ctx.shadowColor='rgba(0,0,0,0.6)'; ctx.shadowBlur=8*s;
  ctx.fillText('VS',0,vsR*0.26);
  ctx.restore();

  /* ---- Cartouche date ---- */
  var dateY=nomY+gap+hNom*0.28;
  ctx.save();
  ctx.font='700 '+((isPay?24:33)*s)+'px "Segoe UI",Arial';
  var dw=ctx.measureText(date).width+(isPay?76:104)*s;
  var dx=W/2-dw/2;
  roundRect(ctx,dx,dateY,dw,hDate,10*s);
  ctx.fillStyle='rgba(255,255,255,0.055)'; ctx.fill();
  ctx.strokeStyle='rgba(255,255,255,0.14)'; ctx.lineWidth=1*s; ctx.stroke();
  // Chevron plein a la place de l'emoji 📅
  ctx.fillStyle=PAL.acc2;
  ctx.beginPath();
  var chx=dx+30*s, chy=dateY+hDate/2, chs=(isPay?9:12)*s;
  ctx.moveTo(chx-chs*0.4,chy-chs); ctx.lineTo(chx+chs*0.7,chy); ctx.lineTo(chx-chs*0.4,chy+chs);
  ctx.closePath(); ctx.fill();
  ctx.fillStyle='rgba(255,255,255,0.92)'; ctx.textAlign='center';
  ctx.fillText(date,W/2+14*s,dateY+hDate*0.68);
  ctx.restore();

  /* ---- Accroche ---- */
  var accY=dateY+hDate+gap+hAcc*0.70;
  ctx.save();
  ctx.textAlign='center';
  ctx.font='800 '+((isPay?25:35)*s)+'px "Segoe UI",Arial';
  ctx.fillStyle=PAL.acc2;
  ctx.shadowColor=PAL.acc2; ctx.shadowBlur=14*s;
  texteEspace(ctx,'PARIEZ MAINTENANT — BONUS 200%',W/2,accY,1.5*s);
  ctx.restore();

  drawPromoBlock(ctx,W,H,s,yPromo);
}


/* Mise en page paysage (1200x630, Facebook) : le match a gauche, l'offre a
   droite. Le bloc promo commun fait 130 px de haut et le pied de page 170 :
   empiles, ils ne laissaient pas de quoi dessiner un ecusson lisible. */
function tplFootballPaysage(ctx,W,H,s){
  var eq1=equipeDe(v('f-sel1')||'gn',v('f-eq1'),1), eq2=equipeDe(v('f-sel2')||'sn',v('f-eq2'),2);
  var nom1=(v('f-eq1')||eq1.nom).toUpperCase();
  var nom2=(v('f-eq2')||eq2.nom).toUpperCase();
  var comp=v('f-comp')||'Champions League', date=v('f-date')||'Ce soir à 21:00';

  var yTop=104*s, yBas=H-170*s-14*s;
  var hUtile=yBas-yTop;
  var xSep=W*0.60;                    // frontiere entre les deux colonnes

  /* ---------- Colonne gauche : le match ---------- */
  var cxG=xSep/2;

  // Badge competition
  ctx.save();
  ctx.font='700 '+(21*s)+'px "Segoe UI",Arial';
  var compTxt=comp.toUpperCase(), esp=2*s;
  var cw=ctx.measureText(compTxt).width+compTxt.length*esp+62*s, chh=36*s;
  var cx0=cxG-cw/2, cy0=yTop;
  roundRect(ctx,cx0,cy0,cw,chh,chh/2);
  ctx.fillStyle='rgba(255,255,255,0.07)'; ctx.fill();
  ctx.strokeStyle=PAL.acc2; ctx.lineWidth=1.4*s; ctx.globalAlpha=0.55; ctx.stroke(); ctx.globalAlpha=1;
  var bx=cx0+24*s, by=cy0+chh/2, br=7*s;
  ctx.beginPath(); ctx.arc(bx,by,br,0,Math.PI*2); ctx.fillStyle='#fff'; ctx.fill();
  ctx.fillStyle='#111'; etoile(ctx,bx,by,br*0.52,br*0.24,5); ctx.fill();
  ctx.fillStyle='rgba(255,255,255,0.92)';
  ctx.font='700 '+(21*s)+'px "Segoe UI",Arial';
  texteEspace(ctx,compTxt,cxG+11*s,cy0+chh*0.66,esp);
  ctx.restore();

  // Ecussons
  var ecY=cy0+chh+22*s;
  var ecH=Math.min(hUtile-(chh+22*s)-46*s, 168*s);
  var ecW=ecH/1.12;
  var ecart=Math.min(xSep*0.29, ecW*0.5+72*s);
  var x1=cxG-ecart-ecW/2, x2=cxG+ecart-ecW/2;

  [[x1,eq1],[x2,eq2]].forEach(function(pp){
    var hx=pp[0]+ecW/2, hy=ecY+ecH*0.45;
    var g=ctx.createRadialGradient(hx,hy,0,hx,hy,ecW*0.95);
    g.addColorStop(0,'rgba(255,255,255,0.16)');
    g.addColorStop(0.45,(pp[1].d.c&&pp[1].d.c[0]||'#ffffff')+'22');
    g.addColorStop(1,'rgba(0,0,0,0)');
    ctx.fillStyle=g; ctx.fillRect(hx-ecW,hy-ecW,ecW*2,ecW*2);
  });
  dessineEcusson(ctx,eq1,x1,ecY,ecW,ecH,s);
  dessineEcusson(ctx,eq2,x2,ecY,ecW,ecH,s);

  // VS
  var vsY=ecY+ecH*0.46, vsR=Math.min(ecW*0.30,44*s);
  ctx.save();
  ctx.translate(cxG,vsY); ctx.rotate(Math.PI/4);
  ctx.shadowColor='rgba(0,0,0,0.7)'; ctx.shadowBlur=16*s; ctx.shadowOffsetY=5*s;
  roundRect(ctx,-vsR*0.72,-vsR*0.72,vsR*1.44,vsR*1.44,vsR*0.22);
  var gVs=ctx.createLinearGradient(-vsR,-vsR,vsR,vsR);
  gVs.addColorStop(0,lerpHex(PAL.acc,'#ffffff',0.25));
  gVs.addColorStop(1,lerpHex(PAL.acc,'#000000',0.45));
  ctx.fillStyle=gVs; ctx.fill();
  ctx.shadowBlur=0; ctx.shadowOffsetY=0;
  ctx.strokeStyle=PAL.acc2; ctx.lineWidth=2*s; ctx.stroke();
  ctx.rotate(-Math.PI/4);
  ctx.font='900 '+(vsR*0.72)+'px "Segoe UI",Arial Black,Arial';
  ctx.fillStyle='#fff'; ctx.textAlign='center';
  ctx.fillText('VS',0,vsR*0.26);
  ctx.restore();

  // Noms
  ctx.save();
  ctx.textAlign='center'; ctx.fillStyle='#fff';
  ctx.shadowColor='rgba(0,0,0,0.85)'; ctx.shadowBlur=10*s;
  var yNom=ecY+ecH+32*s;
  var maxNomP=Math.min(ecart*1.85,(cxG-ecart-16*s)*2);
  [[cxG-ecart,nom1],[cxG+ecart,nom2]].forEach(function(pp){
    var t=policeAjustee(ctx,pp[1],25,maxNomP,s);
    ctx.font='900 '+(t*s)+'px "Segoe UI",Arial Black,Arial';
    ctx.fillText(pp[1],pp[0],yNom);
  });
  ctx.restore();

  /* ---------- Séparateur ---------- */
  var sg=ctx.createLinearGradient(0,yTop,0,yBas);
  sg.addColorStop(0,'rgba(255,255,255,0)');
  sg.addColorStop(0.5,'rgba(255,255,255,0.16)');
  sg.addColorStop(1,'rgba(255,255,255,0)');
  ctx.fillStyle=sg; ctx.fillRect(xSep,yTop,1.4*s,hUtile);

  /* ---------- Colonne droite : l'offre ---------- */
  var cxD=xSep+(W-xSep)/2, larD=(W-xSep)-70*s;

  // Date
  ctx.save();
  ctx.font='700 '+(23*s)+'px "Segoe UI",Arial';
  var dh=48*s, dy=yTop+6*s, dx=cxD-larD/2;
  roundRect(ctx,dx,dy,larD,dh,9*s);
  ctx.fillStyle='rgba(255,255,255,0.055)'; ctx.fill();
  ctx.strokeStyle='rgba(255,255,255,0.14)'; ctx.lineWidth=1*s; ctx.stroke();
  ctx.fillStyle=PAL.acc2;
  ctx.beginPath();
  var chx=dx+24*s, chy=dy+dh/2, chs=9*s;
  ctx.moveTo(chx-chs*0.4,chy-chs); ctx.lineTo(chx+chs*0.7,chy); ctx.lineTo(chx-chs*0.4,chy+chs);
  ctx.closePath(); ctx.fill();
  ctx.fillStyle='rgba(255,255,255,0.92)'; ctx.textAlign='center';
  var tD=policeAjustee2(ctx,date,23,larD-72*s,s);
  ctx.font='700 '+(tD*s)+'px "Segoe UI",Arial';
  ctx.fillText(date,cxD+12*s,dy+dh*0.68);
  ctx.restore();

  // Accroche
  ctx.save();
  ctx.textAlign='center';
  // La colonne droite est etroite : l'accroche en corps fixe depassait du
  // cadre et se faisait couper au bord de l'image.
  var accTxt='BONUS 200% SUR VOTRE 1ᵉʳ DÉPÔT', tAcc=25;
  while(tAcc>13){
    ctx.font='800 '+(tAcc*s)+'px "Segoe UI",Arial';
    if(ctx.measureText(accTxt).width<=larD) break;
    tAcc-=1;
  }
  ctx.fillStyle=PAL.acc2;
  ctx.shadowColor=PAL.acc2; ctx.shadowBlur=12*s;
  ctx.fillText(accTxt,cxD,dy+dh+42*s);
  ctx.restore();

  // Code promo — version compacte, le bloc commun est trop haut ici
  var py=dy+dh+66*s, ph=Math.max(74*s, yBas-py);
  ctx.save();
  roundRect(ctx,cxD-larD/2,py,larD,ph,14*s);
  var pg=ctx.createLinearGradient(cxD-larD/2,py,cxD+larD/2,py+ph);
  pg.addColorStop(0,hexA(PAL.acc,0.16));
  pg.addColorStop(1,hexA(PAL.acc2,0.09));
  ctx.fillStyle=pg; ctx.fill();
  ctx.strokeStyle=hexA(PAL.acc2,0.65); ctx.lineWidth=1.8*s; ctx.stroke();
  ctx.textAlign='center';
  ctx.font='700 '+(15*s)+'px "Segoe UI",Arial';
  ctx.fillStyle='rgba(255,255,255,0.55)';
  texteEspace(ctx,'CODE PROMO EXCLUSIF',cxD,py+27*s,2.6*s);
  ctx.font='900 '+(40*s)+'px "Segoe UI",Arial Black,Arial';
  ctx.fillStyle=PAL.acc2;
  ctx.shadowColor=PAL.acc2; ctx.shadowBlur=16*s;
  texteEspace(ctx,AG.promo||'',cxD,py+70*s,5*s);
  ctx.restore();
}

/* Meme role que policeAjustee, sans la graisse 900 : la date est en 700 et
   mesurer avec la mauvaise graisse la laissait deborder du cartouche. */
function policeAjustee2(ctx,txt,taille,maxW,s){
  var t=taille;
  while(t>13){
    ctx.font='700 '+(t*s)+'px "Segoe UI",Arial';
    if(ctx.measureText(txt).width<=maxW) break;
    t-=1;
  }
  return t;
}

function tplBonus(ctx,W,H,s){
  var pct=v('b-pct')||'200%',cond=v('b-cond')||'Sur votre 1er dépôt !';
  var msg=v('b-msg')||'';

  // Icône cadeau géant
  ctx.font=(160*s)+'px Arial';
  ctx.textAlign='center';
  ctx.fillText('🎁',W/2,320*s);

  // BONUS

function wrapText(ctx,text,x,y,maxW,lh){
  if(!text)return;
  var words=text.split(' '),line='',cy=y;
  for(var i=0;i<words.length;i++){
    var tl=line+words[i]+' ';
    if(ctx.measureText(tl).width>maxW&&i>0){ctx.fillText(line.trim(),x,cy);line=words[i]+' ';cy+=lh;}
    else line=tl;
  }
  ctx.fillText(line.trim(),x,cy);
}
function roundRect(ctx,x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y);ctx.lineTo(x+w-r,y);ctx.quadraticCurveTo(x+w,y,x+w,y+r);
  ctx.lineTo(x+w,y+h-r);ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
  ctx.lineTo(x+r,y+h);ctx.quadraticCurveTo(x,y+h,x,y+h-r);
  ctx.lineTo(x,y+r);ctx.quadraticCurveTo(x,y,x+r,y);ctx.closePath();
}
function lerpHex(a,b,t){
  var ah=parseInt(a.replace('#',''),16),bh=parseInt(b.replace('#',''),16);
  var r=Math.round(((ah>>16)&255)+(((bh>>16)&255)-((ah>>16)&255))*t);
  var g=Math.round(((ah>>8)&255)+(((bh>>8)&255)-((ah>>8)&255))*t);
  var bl=Math.round((ah&255)+((bh&255)-(ah&255))*t);
  return '#'+((1<<24)+(r<<16)+(g<<8)+bl).toString(16).slice(1);
}
function hexA(hex,alpha){
  var h=parseInt(hex.replace('#',''),16);
  return 'rgba('+((h>>16)&255)+','+((h>>8)&255)+','+(h&255)+','+alpha+')';
}
